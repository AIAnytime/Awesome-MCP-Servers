name: PR-Agent review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]

# PR-Agent reads the PR diff through GitHub's API. Never check out or execute
# code from a fork in a pull_request_target workflow.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.sender.type != 'Bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run PR-Agent with Gemini
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '[]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          pr_reviewer.extra_instructions: >-
            Review this repository as a strict community directory for Model Context Protocol servers.
            Check CONTRIBUTING.md requirements: exactly one server per PR; a real MCP server using
            stdio, Streamable HTTP, or SSE; publicly reachable repository, package, or hosted endpoint;
            valid category and transport; accurate one-sentence factual description; no promotional
            claims or tracking parameters; no duplicate server name, product, or domain; valid endpoint
            for hosted entries; and generated README consistency. Pay special attention to false claims,
            undisclosed affiliation, dead links, authentication requirements, security-sensitive claims,
            and entries that merely wrap a generic API without implementing MCP. Clearly separate
            verified facts from claims made by the submitter. Flag uncertainty rather than guessing.
